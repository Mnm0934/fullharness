<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フルハーネス安全教育 WEB講座 デモ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6f8;color:#17202a}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.app{min-height:100vh}.top{background:#132238;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:20px}.badge{font-size:12px;background:#dfe8f5;color:#132238;padding:5px 9px;border-radius:99px;margin-left:8px}
.container{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 5px 20px #17202a12;margin-bottom:18px}
h1{font-size:30px;margin:0 0 8px}h2{font-size:21px;margin:0 0 14px}h3{margin:0 0 8px}.muted{color:#687585}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.hero{background:linear-gradient(135deg,#132238,#274d73);color:#fff;border-radius:18px;padding:30px;margin-bottom:18px}
.hero p{color:#dce7f2;line-height:1.7}.btn{background:#1769aa;color:#fff}.btn.secondary{background:#e9eef4;color:#26384a}.btn.green{background:#198754}.btn.red{background:#c0392b}
.progress{height:10px;background:#e7edf2;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#1769aa}
.module{border:1px solid #e2e7ec;border-radius:14px;padding:18px}.module.done{border-color:#a9d9bf;background:#f5fcf8}.module.lock{opacity:.55}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.small{font-size:13px}.status{font-weight:800;font-size:13px}.ok{color:#198754}.wait{color:#9a6a00}.locktxt{color:#687585}
input{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:10px;margin:7px 0 14px;font-size:15px}
.login{max-width:460px;margin:70px auto}.notice{background:#fff8df;border-left:4px solid #e0ad22;padding:14px;border-radius:8px;line-height:1.6}
.question{border-top:1px solid #e6ebef;padding:18px 0}.option{display:block;background:#f5f7f9;padding:12px;border-radius:10px;margin:8px 0}.option input{width:auto;margin:0 8px 0 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6ebef}th{font-size:13px;color:#687585}
.cert{max-width:760px;margin:auto;border:8px double #203a56;padding:50px;background:#fff;text-align:center}.cert .title{font-size:34px;font-weight:900;letter-spacing:.25em;margin:20px}.cert .name{font-size:26px;margin:28px}.cert .no{font-family:monospace;margin-top:28px}
.nav{display:flex;gap:8px}.hidden{display:none!important}
@media(max-width:650px){.top{padding:15px}.brand{font-size:16px}h1{font-size:24px}.hero{padding:22px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const modules=[
 {id:1,title:"作業に関する知識",minutes:60,desc:"墜落災害の危険性、作業環境、安全な作業方法について学びます。"},
 {id:2,title:"墜落制止用器具に関する知識",minutes:120,desc:"フルハーネス型・ランヤード等の種類、構造、点検について学びます。"},
 {id:3,title:"労働災害の防止に関する知識",minutes:60,desc:"墜落・転落災害を防止するための基本的な考え方を学びます。"},
 {id:4,title:"関係法令",minutes:30,desc:"安全衛生関係法令と特別教育に関する基本事項を学びます。"},
 {id:5,title:"使用方法等の確認",minutes:90,desc:"装着・点検・使用時の注意事項を確認します。"}
];
const questions=[
 ["フルハーネス型墜落制止用器具を使用する際に重要なことは？",["適切な点検と正しい装着","できるだけ緩く装着する","点検は不要","ランヤードを自由に改造する"],0],
 ["使用前点検について正しいものは？",["異常があっても使用する","点検記録は不要","損傷等がないか確認する","見た目だけで判断する"],2],
 ["作業場所の危険性を確認する目的は？",["作業時間を短くするためだけ","墜落リスクを把握し対策するため","道具を減らすため","服装を決めるため"],1],
 ["関係法令を学ぶ目的として適切なのは？",["安全な作業と法令遵守につなげる","試験を難しくする","書類を増やす","特に目的はない"],0],
 ["器具に異常が見つかった場合は？",["そのまま使用する","自分で勝手に改造する","使用を中止し適切に対応する","隠しておく"],2]
];

let state=JSON.parse(localStorage.getItem("fhDemo")||"null")||{
 user:{name:"山田 太郎",id:"DEMO-001"},started:null,completed:[],sessions:{},test:null,cert:null
};
function save(){localStorage.setItem("fhDemo",JSON.stringify(state))}
function now(){return new Date().toLocaleString("ja-JP")}
function totalDone(){return state.completed.length}
function renderTop(){
 return `<div class="top"><div class="brand">フルハーネス安全教育 <span class="badge">DEMO</span></div>
 <div class="nav"><button class="btn secondary" onclick="dashboard()">受講者</button><button class="btn secondary" onclick="admin()">管理者</button></div></div>`;
}
function dashboard(){
 document.getElementById("app").innerHTML=renderTop()+`<div class="container">
 <div class="hero"><div class="small">WEB講座 デモシステム</div><h1>フルハーネス安全教育</h1>
 <p>受講者：${state.user.name}　｜　受講番号：${state.user.id}</p>
 <div class="progress"><div style="width:${totalDone()/modules.length*100}%"></div></div>
 <p class="small">${totalDone()} / ${modules.length} 科目修了</p></div>
 <div class="card"><h2>受講状況</h2><div class="grid">${modules.map((m,i)=>{
 let done=state.completed.includes(m.id), unlocked=i===0||state.completed.includes(modules[i-1].id);
 return `<div class="module ${done?'done':''} ${!unlocked?'lock':''}">
 <div class="row"><h3>${m.id}. ${m.title}</h3><span class="status ${done?'ok':unlocked?'wait':'locktxt'}">${done?'✓ 修了':unlocked?'受講可能':'🔒 ロック'}</span></div>
 <p class="muted small">${m.desc}</p><p class="small">想定講習時間：${m.minutes}分</p>
 ${unlocked&&!done?`<button class="btn" onclick="course(${m.id})">この科目を受講</button>`:done?`<button class="btn secondary" onclick="course(${m.id})">受講内容を見る</button>`:''}
 </div>`}).join("")}</div></div>
 ${totalDone()===modules.length?`<div class="card"><h2>修了テスト</h2><p>全科目の受講が完了しました。テストを受けてください。</p>
 <button class="btn" onclick="test()">修了テストへ</button></div>`:''}
 ${state.cert?`<div class="card"><h2>🎓 修了証</h2><p>修了証を発行できます。</p><button class="btn green" onclick="certificate()">修了証を表示</button></div>`:''}
 </div>`;
}
function course(id){
 const m=modules.find(x=>x.id===id), done=state.completed.includes(id);
 if(!state.sessions[id]) state.sessions[id]={start:null,end:null,seconds:0};
 document.getElementById("app").innerHTML=renderTop()+`<div class="container">
 <div class="card"><div class="small">第${m.id}科目</div><h1>${m.title}</h1><p class="muted">${m.desc}</p>
 <div class="notice">デモ版では動画の代わりに講習テキストを表示しています。実運用版ではここに講義教材・受講時間管理を組み込みます。</div>
 <h2 style="margin-top:24px">講習テキスト</h2>
 <p>フルハーネス型墜落制止用器具は、墜落による危険を防止するために使用する重要な保護具です。使用前には器具の状態を確認し、作業環境や墜落時のリスクを把握したうえで、適切な方法で使用する必要があります。</p>
 <p>このデモでは、受講開始・終了時刻を記録し、科目ごとの受講状況を管理します。</p>
 <hr>
 <div class="row"><div><b>受講開始：</b><span id="start">${state.sessions[id].start||"未開始"}</span><br><b>受講終了：</b><span id="end">${state.sessions[id].end||"未終了"}</span></div>
 <div><b>記録時間：</b><span id="timer">0分</span></div></div>
 <div style="margin-top:18px">${!state.sessions[id].start?`<button class="btn" onclick="startCourse(${id})">受講を開始する</button>`:`<button class="btn green" onclick="finishCourse(${id})">${done?'修了済み':'科目を修了する'}</button>`}
 <button class="btn secondary" onclick="dashboard()">戻る</button></div>
 </div></div>`;
}
let interval;
function startCourse(id){state.sessions[id].start=now();state.sessions[id].startedAt=Date.now();save();course(id)}
function finishCourse(id){
 let s=state.sessions[id]; if(!s.start)return;
 s.end=now();s.seconds=Math.max(1,Math.floor((Date.now()-s.startedAt)/1000));
 if(!state.completed.includes(id))state.completed.push(id);
 save();dashboard();
}
function test(){
 if(totalDone()<modules.length)return dashboard();
 document.getElementById("app").innerHTML=renderTop()+`<div class="container"><div class="card"><h1>修了テスト</h1><p class="muted">全5問・80点以上で合格（デモ設定）</p>
 <form id="quiz">${questions.map((q,i)=>`<div class="question"><b>第${i+1}問　${q[0]}</b>${q[1].map((o,j)=>`<label class="option"><input required type="radio" name="q${i}" value="${j}">${o}</label>`).join("")}</div>`).join("")}
 <button class="btn" type="submit">採点する</button> <button type="button" class="btn secondary" onclick="dashboard()">戻る</button></form></div></div>`;
 document.getElementById("quiz").onsubmit=e=>{e.preventDefault();let score=0;questions.forEach((q,i)=>{if(+new FormData(e.target).get("q"+i)===q[2])score+=20});state.test={score,date:now(),passed:score>=80};if(state.test.passed)state.cert={no:"FH-"+new Date().getFullYear()+"-"+state.user.id.replace(/\D/g,""),date:new Date().toLocaleDateString("ja-JP")};save();result()};
}
function result(){let t=state.test;document.getElementById("app").innerHTML=renderTop()+`<div class="container"><div class="card" style="text-align:center"><div style="font-size:50px">${t.passed?'🎓':'📝'}</div><h1>${t.passed?'合格':'不合格'}</h1><p style="font-size:28px;font-weight:800">${t.score}点</p><p>${t.passed?'全ての修了条件を満たしたデモとして修了証を発行できます。':'80点以上で合格です。もう一度受験できます。'}</p>${t.passed?`<button class="btn green" onclick="certificate()">修了証を表示</button>`:`<button class="btn" onclick="test()">再受験する</button>`} <button class="btn secondary" onclick="dashboard()">マイページ</button></div></div>`}
function certificate(){
 let c=state.cert;document.getElementById("app").innerHTML=renderTop()+`<div class="container"><div class="card"><div class="cert">
 <div class="small">CERTIFICATE OF COMPLETION</div><div class="title">修 了 証</div><p>フルハーネス安全教育</p><div class="name">${state.user.name} 様</div>
 <p>上記の講習について、所定のデモ受講条件を満たしたことを証します。</p><p>修了日：${c.date}</p><p class="no">修了番号：${c.no}</p><p style="margin-top:50px">講習運営事務局</p>
 </div><div style="text-align:center;margin-top:18px"><button class="btn" onclick="window.print()">印刷／PDF保存</button> <button class="btn secondary" onclick="dashboard()">戻る</button></div></div></div>`;
}
function admin(){
 let rows=modules.map(m=>{let s=state.sessions[m.id]||{};return `<tr><td>${m.id}. ${m.title}</td><td>${s.start||'—'}</td><td>${s.end||'—'}</td><td>${s.seconds?Math.floor(s.seconds/60)+'分':'—'}</td><td>${state.completed.includes(m.id)?'✅ 修了':'未修了'}</td></tr>`}).join("");
 document.getElementById("app").innerHTML=renderTop()+`<div class="container"><div class="hero"><div class="small">ADMIN</div><h1>管理者ダッシュボード</h1><p>デモ用の受講管理画面です。</p></div>
 <div class="card"><h2>受講者</h2><table><tr><th>氏名</th><th>受講番号</th><th>テスト</th><th>修了証</th></tr><tr><td>${state.user.name}</td><td>${state.user.id}</td><td>${state.test?state.test.score+'点 '+(state.test.passed?'合格':'不合格'):'未受験'}</td><td>${state.cert?'発行済':'—'}</td></tr></table></div>
 <div class="card"><h2>科目別受講履歴</h2><div style="overflow:auto"><table><tr><th>科目</th><th>開始</th><th>終了</th><th>記録時間</th><th>状態</th></tr>${rows}</table></div></div>
 <div class="card"><button class="btn red" onclick="resetDemo()">デモデータをリセット</button></div></div>`;
}
function resetDemo(){if(confirm("デモの受講履歴をリセットしますか？")){localStorage.removeItem("fhDemo");location.reload()}}
dashboard();
</script>
</body>
</html>
